<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.1"/>
    </linearGradient>
    <clipPath id="rounded">
      <rect width="512" height="512" rx="90" ry="90"/>
    </clipPath>
  </defs>
  <g clip-path="url(#rounded)">
    <!-- Mexican flag stripes -->
    <rect x="0" y="0" width="171" height="512" fill="#006847"/>
    <rect x="171" y="0" width="170" height="512" fill="#fff"/>
    <rect x="341" y="0" width="171" height="512" fill="#CE1126"/>
    <!-- Eagle circle background -->
    <circle cx="256" cy="240" r="110" fill="#006847" opacity="0.9"/>
    <circle cx="256" cy="240" r="100" fill="#f5e6c8" opacity="0.15"/>
    <!-- Cactus base -->
    <rect x="240" y="280" width="32" height="40" rx="4" fill="#4a7c3f"/>
    <!-- Cactus trunk -->
    <rect x="248" y="170" width="16" height="140" rx="8" fill="#4a7c3f"/>
    <!-- Cactus left arm -->
    <rect x="220" y="210" width="12" height="50" rx="6" fill="#4a7c3f"/>
    <rect x="220" y="210" width="40" height="12" rx="6" fill="#4a7c3f"/>
    <!-- Cactus right arm -->
    <rect x="280" y="230" width="12" height="40" rx="6" fill="#4a7c3f"/>
    <rect x="264" y="230" width="28" height="12" rx="6" fill="#4a7c3f"/>
    <!-- Eagle simplified -->
    <path d="M230 240 C220 225, 215 210, 230 200 C240 195, 250 200, 256 210 C262 200, 272 195, 282 200 C297 210, 292 225, 282 240 L270 235 C275 225, 278 215, 272 210 C268 208, 262 212, 256 220 C250 212, 244 208, 240 210 C234 215, 237 225, 242 235 Z" fill="#8B4513"/>
    <!-- Eagle head -->
    <circle cx="256" cy="205" r="12" fill="#8B4513"/>
    <!-- Eagle beak -->
    <path d="M256 210 L250 218 L262 218 Z" fill="#DAA520"/>
    <!-- Eagle eye -->
    <circle cx="253" cy="203" r="2" fill="#fff"/>
    <circle cx="259" cy="203" r="2" fill="#fff"/>
    <!-- Snake in beak -->
    <path d="M248 216 C244 220, 240 218, 238 222 C236 226, 240 228, 244 226" stroke="#4a7c3f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M264 216 C268 220, 272 218, 274 222 C276 226, 272 228, 268 226" stroke="#4a7c3f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Laurel wreath left -->
    <path d="M200 290 C210 270, 220 260, 230 255" stroke="#4a7c3f" stroke-width="3" fill="none"/>
    <ellipse cx="208" cy="278" rx="6" ry="10" fill="#4a7c3f" transform="rotate(-30 208 278)"/>
    <ellipse cx="215" cy="268" rx="6" ry="10" fill="#4a7c3f" transform="rotate(-20 215 268)"/>
    <ellipse cx="224" cy="260" rx="6" ry="10" fill="#4a7c3f" transform="rotate(-10 224 260)"/>
    <!-- Laurel wreath right -->
    <path d="M312 290 C302 270, 292 260, 282 255" stroke="#4a7c3f" stroke-width="3" fill="none"/>
    <ellipse cx="304" cy="278" rx="6" ry="10" fill="#4a7c3f" transform="rotate(30 304 278)"/>
    <ellipse cx="297" cy="268" rx="6" ry="10" fill="#4a7c3f" transform="rotate(20 297 268)"/>
    <ellipse cx="288" cy="260" rx="6" ry="10" fill="#4a7c3f" transform="rotate(10 288 260)"/>
    <!-- Text banner -->
    <rect x="130" y="370" width="252" height="65" rx="12" fill="#006847"/>
    <rect x="134" y="374" width="244" height="57" rx="10" fill="none" stroke="#DAA520" stroke-width="2"/>
    <text x="256" y="414" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="900" font-size="38" fill="#fff" letter-spacing="3">VISA MX</text>
    <!-- Shine overlay -->
    <rect width="512" height="512" fill="url(#shine)"/>
  </g>
</svg>
